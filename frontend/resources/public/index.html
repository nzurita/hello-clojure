<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hola Clojure</title>
    <link rel="stylesheet" href="styles/base.css">
  </head>
  <body>
    <div id="form-container">
      <form id="persona-form">
        <label>
          Nombre
          <input type="text" name="nombre" placeholder="Nombre" required />
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="Email" required />
        </label>
        <label>
          Edad
          <input type="number" name="edad" placeholder="Edad" min="0" max="150" required />
        </label>
        <button type="submit">Validar (RPC)</button>
      </form>
      <hr />
      <div>
        <button type="button" id="bt-get-character">Get character</button>
      </div>
      <hr />
    </div>
    <div id="character-container">
    </div>

    <pre id="app"></pre>
    <pre id="app-status-bar"></pre>

    <!-- Sandbox JS: sustituiremos esto por React/Rumext en la Fase 9 -->
    <!-- <script src="/js/main.js"></script> -->

    <script>
      /**
       * Lee los campos del formulario y devuelve un objeto JSON-ready.
       * Malli espera :edad como entero, no string.
       */
      function form2Json(form) {
        let datos = new FormData(form);
        return {
          nombre: datos.get("nombre").trim(),
          email: datos.get("email").trim(),
          edad: parseInt(datos.get("edad"), 10)
        };
      }

      /**
       * Llama al comando RPC del backend (POST + JSON).
       * Penpot hace lo mismo con (cmd! :saludar-persona params), pero en Transit.
       */
      function callSaludarPersona(persona) {
        return fetch("/api/rpc/command/saludar-persona", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(persona)
        }).then(function (resp) {
          return resp.json().then(function (data) {
            return { status: resp.status, data: data };
          });
        });
      }

      /**
       * Pinta la respuesta del servidor de forma legible.
       */
      function showResult(estado) {
        const app = document.getElementById("app");
        let data = estado.data;

        if (data.ok) {
          app.textContent = "OK (" + estado.status + "): " + data.mensaje;
        } else if (data.errores) {
          app.textContent =
            "Validación fallida (" + estado.status + "):\n" +
            JSON.stringify(data.errores, null, 2);
        } else {
          app.textContent =
            "Error (" + estado.status + "):\n" +
            JSON.stringify(data, null, 2);
        }
      }

      document.getElementById("persona-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const personaJson = form2Json(event.target);
        document.getElementById("app").textContent = "Enviando…";

        callSaludarPersona(personaJson)
          .then(showResult)
          .catch(function (err) {
            document.getElementById("app").textContent = "Error de red: " + err;
          });
      });

      /* #### CHARACTER #### */

    function renderCharacter(container, character) {
        console.log('renderCharacter', character);
        container.replaceChildren();

        const img = document.createElement("img");
        img.src = character.avatar;
        img.alt = character.name ?? "Avatar";

        const p = document.createElement("p");
        p.textContent = character["intro-text"];

        const a = document.createElement("a");
        a.href = character["cv-path"];
        a.textContent = "Ver CV";

        container.append(img, p, a); // o appendChild uno a uno
    }

    function processCharacterResponse(response) {
        if (!response.data.ok) {
            showStatus(response.data.error ?? "Invalid character");

            throw new Error(response.data.error ?? "Invalid character");
        }

        console.log('processCharacter', response.data.character);
        return response.data.character;
    }

    /**
    * Llama al comando RPC del backend (POST + JSON).
    */
    function callGetCharacter() {
        return fetch("/api/rpc/command/get-character?id=0")
            .then(function (resp) {
                return resp.json().then(function (data) {
                  console.log(data);
                  return { status: resp.status, data: data };
                });
            });
    }

    function showStatus(message)
    {
        document.getElementById("app-status-bar").textContent = message;
    }

    document.getElementById("bt-get-character").addEventListener("click", function (event) {
        const characterContainer = document.getElementById("character-container");
        
        event.preventDefault();

        document.getElementById("app-status-bar").textContent = "Enviando…";

        callGetCharacter()
          .then(processCharacterResponse)
          .then(function (character) {
              renderCharacter(characterContainer, character);
              document.getElementById("app-status-bar").textContent = "";
            })
            .catch(function (err) {
              showStatus(String(err));
            });
      });
    </script>
  </body>
</html>
