# Configuración de nginx para el contenedor de desarrollo.
# - Sirve los estáticos del frontend (cuando existan).
# - Reenvía /api al backend Clojure (proxy inverso), igual que en Penpot.
server {
    listen 8080 default_server;
    server_name _;

    # Raíz de los estáticos del SPA (se generará en una fase posterior).
    root /workspace/frontend/resources/public;
    index index.html;

    # Las llamadas a la API van al backend (Clojure) en el puerto 9090.
    location /api/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
