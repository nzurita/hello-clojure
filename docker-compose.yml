# Orquestación del entorno de desarrollo: un único contenedor "todo en uno".
# Equivale a tu docker-compose.yml de LAMP, pero con un solo servicio.
services:
  wdev-clojure-jdk-21:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: wdev-clojure-jdk-21
    container_name: wdev-clojure-jdk-21
    hostname: wdev-clojure-jdk-21
    ports:
      - "80:8080"     # nginx (la web) -> http://localhost
      - "9090:9090"   # backend HTTP (Clojure)
      - "6064:6064"   # nREPL del backend (conectas tu editor aquí)
      - "9630:9630"   # shadow-cljs (hot-reload del frontend)
      - "5432:5432"   # PostgreSQL
    volumes:
      # Código del proyecto montado en vivo (como tu /var/www/html).
      - ./:/workspace
      # Datos persistentes de PostgreSQL.
      - wdev-clojure-pg:/var/lib/postgresql
      # Caché de dependencias (sobrevive a recrear el contenedor).
      - wdev-clojure-m2:/root/.m2            # libs Maven/Clojars (como el caché de Composer)
      - wdev-clojure-gitlibs:/root/.gitlibs  # dependencias vía git (:git/url)
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  wdev-clojure-pg:
  wdev-clojure-m2:
  wdev-clojure-gitlibs:
